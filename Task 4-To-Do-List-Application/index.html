<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced To-Do List - KannanTech</title>
    <link rel="icon" href="logo.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header with Logo and Theme Toggle -->
        <div class="header">
            <div class="logo-section">
                <img src="logo.png" alt="KannanTech Logo" class="logo">
                <div class="company-info">
                    <h1>My To-Do List 📝</h1>
                    <p class="powered-by">Powered by <span class="company-name">KannanTech</span></p>
                </div>
            </div>
            <button id="themeToggle" class="theme-toggle" title="Toggle Dark Mode">🌙</button>
        </div>

        <!-- Statistics Dashboard -->
        <div class="stats-dashboard">
            <div class="stat-card">
                <div class="stat-number" id="totalTasks">0</div>
                <div class="stat-label">Total Tasks</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="completedTasks">0</div>
                <div class="stat-label">Completed</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="activeTasks">0</div>
                <div class="stat-label">Active</div>
            </div>
        </div>

        <!-- Progress Bar -->
        <div class="progress-container">
            <div class="progress-bar" id="progressBar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">0% Complete</div>
        </div>

        <!-- Input Area with Priority -->
        <div class="input-area">
            <input type="text" id="taskInput" placeholder="Add a new task...">
            <select id="prioritySelect" class="priority-select">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
            </select>
            <input type="date" id="dueDateInput" class="date-input">
            <button id="addButton" class="btn btn-success">Add</button>
        </div>

        <!-- Search and Filter Controls -->
        <div class="controls">
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="🔍 Search tasks..." class="search-input">
            </div>
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="action-buttons">
            <button id="clearCompletedButton" class="btn btn-warning">Clear Completed</button>
            <button id="clearAllButton" class="btn btn-danger">Clear All</button>
        </div>

        <!-- Task List -->
        <ul id="taskList" class="task-list"></ul>

        <!-- Empty State -->
        <div id="emptyState" class="empty-state">
            <div class="empty-icon">📋</div>
            <p>No tasks yet. Add one to get started!</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
